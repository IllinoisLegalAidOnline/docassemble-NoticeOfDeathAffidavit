id: owner county
question: |
  Where was ${owner.name_full()} living when they died?
fields:
  - State: owner.address.state
    default: IL
    code: |
      states_list() 
    js show if: |
      val('owner.outside_us') === false
  - County: owner.trial_court_index
    datatype: integer
    js show if:  |
      val('owner.address.state') === "IL" && val('owner.outside_us') === false
    code: |
      court_county_lookup()
  - County: owner.address.county
    js show if:  |
      val('owner.address.state') != "IL" && val('owner.outside_us') === false
  - ${owner.name_full()} was not living in the United States.: owner.outside_us
    datatype: yesno
  - Country: owner.country
    js show if:
      val('owner.outside_us') === true
validation code: |
  if not owner.outside_us and owner.address.state == "IL":
    if owner.trial_court_index == -1:
      owner.address.county = "Cook"
    else:
      owner_court = court_list.as_court(
        'owner_court',
        owner.trial_court_index
      )
      owner.address.county = str(owner_court.address.county)
---
code: |
  def court_county_lookup(lowercase=False):
    all_court_counties = court_list._load_courts()['address_county'].items()
    filtered_courts = [(-1, "cook")] if lowercase else [(-1, "Cook")]
    for court in all_court_counties:
      if court[1] != "Cook":
        court_name = court[1].lower() if lowercase else court[1]
        filtered_courts.append((court[0],court_name))
    return sorted( filtered_courts, key=lambda y: y[1])
---
