id: property address
question: |
  What is the address of the property?
fields:
  - Street address: notice_property.address
    address autocomplete: True
  - Address line 2: notice_property.unit
    required: False
  - City: notice_property.city
  - State: notice_property.state
    default: IL
    code: |
      states_list() 
  - ZIP code: notice_property.zip
  - County: notice_property.county
validation code: |
  if notice_property.state != "IL":
    validation_error("This program can only be used for properties in Illinois.", field="notice_property.state")
---
id: property pin
question: |
  What is the Property Index Number ("PIN") for this property? 
subquestion: |
  The PIN is sometimes called a "Property Account Number (PAN)," a "parcel number," or a "permanent index number." It should be listed on the TODI.

  You can also find the PIN at the County Clerk's Office or Assessor's Office, and sometimes at the county's website. If the property is in one of the counties below, click their website to look up the PIN: 

  * [**Cook County**](http://www.cookcountypropertyinfo.com/)
  * [**DuPage County**](http://www.dupageco.org/PropertyInfo/PropertyLookup.aspx)
  * [**Kane County**](https://lrs.kanecountyrecorder.net/)
  * [**Lake County**](http://www.lakecountyil.gov/154/Chief-County-Assessment-Office)
  * [**McHenry County**](http://www.mchenrycountygis.org/Athena)
  * [**Will County**](https://www.willcountysoa.com/section/Property-Search-Portal)
  
  If the property is in a different county, search online to find the county's Recorder of Deeds website and see if you can look up the PIN for free online.
  
  The format of a PIN is 12-12-123-123-1234.
fields:
  - PIN: notice_property.pin
    maxlength: 40
---
id: property description
question: |
  What is the legal description of the property?
subquestion: |
  The legal description should be listed in the TODI.

  **Note:** Be careful in writing the property description. You should copy the legal description exactly. You may wish to compare the TODI to other documents (such as a deed) to see if the descriptions are the same. If your property is in one of the counties listed below, click their website to look up the legal description.

  * [**Cook County**](http://cookrecorder.com/)
  * [**DuPage County**](https://www.dupagecounty.gov/elected_officials/recorder/)
  * [**Kane County**](https://lrs.kanecountyrecorder.net/)
  * [**Lake County**](https://www.lakecountyil.gov/258/Recorder-of-Deeds)
  * [**McHenry County**](https://www.mchenrycountyil.gov/departments/county-recorder/public-records-search-options)
  * [**Will County**](https://www.willcountysoa.com/section/Property-Search-Portal)

  If your property is in a different county, search online to find your county's Recorder of Deeds website and see if you can look up the legal description for free online.
fields:
  - Legal description: notice_property.description
    input type: area
    rows: 20
    maxlength: 5000
    label above field: True
