id: welcome
question: |
  Notice of Death Affidavit
subquestion: |
  Welcome to Illinois Legal Aid Online's **Notice of Death Affidavit** Easy Form.

  This program helps you prepare a Notice of Death Affidavit for a property located in Illinois. 
  
  A Notice of Death Affidavit tells the Recorder of Deeds office that a property owner has died and their property now belongs to the beneficiaries listed on the owner's Transfer on Death Instrument.
  
  The form you create can only be used in Illinois.
field: sees_nav_bar
---
id: notice requirements
continue button field: notice_requirements
question: |
  Information about Notice of Death Affidavit
subquestion: |
  When someone makes a Transfer on Death Instrument (TODI) for their property and then dies, their property goes to their beneficiaries. A Notice of Death Affidavit tells the Recorder of Deeds office about the transfer. To learn more about TODIs, read ILAO's [**Transfer on Death Instrument FAQ**](https://www.illinoislegalaid.org/legal-information/transfer-death-instrument-common-questions).
  
  To use this program, you will need a copy of the TODI. You can use this program if: 

  * The property owner who made the TODI has died,

  * You are a beneficiary named in the TODI, and,
  
  * The property being transferred is in Illinois.

  After you finish the notice, you and any other beneficiaries will need to sign it in front of a notary. To learn more, read ILAO's article, [**What is a notary?**](https://www.illinoislegalaid.org/legal-information/what-notary)
---
id: instructions
continue button field: how_to_use
question: |
  Instructions
subquestion: |
  Set aside 10 to 20 minutes to finish this program. You can log in and save your work to return to later. 

  After you download your form, you and any other beneficiaries will need to sign it in front of a notary. To learn more, read ILAO's article, [**What is a notary?**](https://www.illinoislegalaid.org/legal-information/what-notary) 
  
  Then, you will need to send the Notice of Death Affidavit to the Recorder of Deeds office in the county where the transferred property is.
  
  ${ collapse_template(help_example) }  

  Click on **{green words}** to learn what they mean. Some questions have a question mark in a circle ${ fa_icon("question-circle", color_css="#0DCAF0" ) } that helps explain things.
---
