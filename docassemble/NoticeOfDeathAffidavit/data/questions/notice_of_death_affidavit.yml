continue button field: common_explanation
question: |
  Tenancy in common
subquestion: |
  Since ${owner.name_full()} was a **tenant in common**, they and the other owners may have made a TODI together. However, this program does not work with a shared TODI for **tenants in common**. You may want to [**Get Legal Help**](https://www.illinoislegalaid.org/get-legal-help).
  
  If ${owner.name_full()} made a TODI by themself for their share of the property, you can use this program. In that case, only ${owner.name_full()}'s share will go to you and any other beneficiaries.
