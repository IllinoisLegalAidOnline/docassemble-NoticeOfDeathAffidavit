id: user is beneficiary
question: |
  Are you a beneficiary named in the TODI?
subquestion: |
  A beneficiary is someone who will inherit all or part of the property. The TODI lists all of the beneficiaries.

  If the TODI names you as a successor to a beneficiary and that beneficiary has died, click **Yes**.
fields:
  - no label: user_is_beneficiary
    datatype: yesnoradio
