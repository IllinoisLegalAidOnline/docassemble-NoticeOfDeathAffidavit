id: has todi
question: |
  Is there a TODI for the property?
subquestion: |
  A Transfer on Death Instrument (TODI) is a document that allows a person who owns Illinois real estate to give it to another person when they die. The document works outside of the probate process, so the beneficiary does not have to go to probate court to get the property.
fields:
  - no label: has_todi
    datatype: yesnoradio
---
id: no todi kickout
event: no_todi_kickout
question: |
  Sorry
subquestion: |
  You can only use this program if there is a Transfer on Death Instrument (TODI) for the property. The property may need to be settled with the rest of the owner's estate. For more information about what happens with someone's estate after they die, see ILAO's [**Settling an estate after someone dies FAQ**](https://www.illinoislegalaid.org/legal-information/how-do-i-settle-estate-after-someone-dies).

  Click **Back** if you made a mistake. Or you can talk with a lawyer to discuss your options. Use **[Get Legal Help](https://www.illinoislegalaid.org/get-legal-help)** to find free or low-cost legal services in your area.
buttons:
  - Exit: exit
  - Restart: restart
