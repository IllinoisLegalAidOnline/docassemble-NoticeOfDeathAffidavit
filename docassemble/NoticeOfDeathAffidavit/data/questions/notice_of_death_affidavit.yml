subquestion: |
  ${users.table}

  ${users.add_action()}
---
id: users table
table: users.table
rows: users
columns:
  - Name: |
      row_item.name_full() if defined("row_item.name.first") else ""
edit:
  - review_user
delete buttons: True
confirm: True
read only: important
---
code: |
  users[0].important = {'delete': False, 'edit': True }
  set_important_trait = True
---
id: user review screen
continue button field: x.review_user
generic object: ALIndividual
question: |
  Edit ${x.name_full()}'s information
review:
  - Edit: x.name.first
    button: |-
      **Name:**
      
      ${x.name_full()}
  - Edit: x.related_who
    button: |
      **${x.name_full()} is related to:**
      
      ${x.related_who}
    show if: other_owners_check != "sole" and shared_owners_type != "Tenancy in common"
  - Edit: x.relationship_radio
    button: |
      % if other_owners_check == "multiple" and shared_owners_type != "Tenancy in common":
      **${x.name_full()}'s relationship to ${x.related_who}:**
      % else:
      **${x.name_full()}'s relationship to ${owner.name_full()}:**
      % endif
      
      % if x.relationship_radio == "Other":
      ${x.relationship}
      % else:
      ${x.relationship_radio}
      % endif
  - Edit: x.address.address
    button: |
      **${x.name_full()}'s address:**
      
      ${x.address.line_one(bare=True)}      
      ${x.address.line_two()}      
      ${end_in_county(x.address.county)}
  - Edit: x.percent_share
    button: |
      **${x.name_full()}'s percent share of the property:**
      
      ${truncate_hundredth(x.percent_share)}%
    show if: users.number_gathered() > 1 and tenancy_type == "Tenants in common" and not even_split
  - Edit: even_split
    button: |
      **${x.name_full()}'s percent share of the property:**
      
      ${truncate_hundredth(x.equal_percent_share)}%
    show if: users.number_gathered() > 1 and tenancy_type == "Tenants in common" and even_split
  - Edit: tenancy_type
    button: |
      **${x.name_full()}'s percent share of the property:**
      
      ${truncate_hundredth(x.equal_percent_share)}%
    show if: users.number_gathered() > 1 and tenancy_type != "Tenants in common"
---
id: revisit other_owners
continue button field: other_owners.revisit
question: |
  Edit information about the other owners
subquestion: |-
  ${other_owners.table}

  ${other_owners.add_action()}
---
id: other owners table
table: other_owners.table
rows: other_owners
columns:
  - Name: |
      row_item.name_full() if defined("row_item.name.first") else ""
  - Address and other information: |
      action_button_html(url_action(row_item.attr_name("review_owner")), label="Edit", icon="pencil-alt")
delete buttons: True
confirm: True
---
id: other owner review screen
continue button field: x.review_owner
generic object: ALIndividual
question: |
  Edit ${x.name_full()}'s information
review:
  - Edit: x.name.first
    button: |
      **Name:**

      ${x.name_full()}
  - Edit: x.death_date
    button: |
      **Date of ${x.name_full()}'s death:**

      ${x.death_date }
  - Edit: x.outside_us
    button: |
      **Where was ${x.name_full()} living when they died?**

      % if x.outside_us:
      ${x.country}
      % else:
      ${end_in_county(x.address.county)}, ${x.address.state}
      % endif
  - Edit: x.marital_status
    button: |
      **${x.name_full()}'s marital status when they died:**

      ${ x.marital_status }
---
id: property review screen
section: Property
event: section_property
question: |
  Property
subquestion: |
  Edit your answers below.
review:
  - Edit: notice_property.address
    button: |
      **Address of the property:**

      ${notice_property.line_one(bare=True)}     
      ${notice_property.line_two()}      
      ${end_in_county(notice_property.county)}
  - Edit: todi_filed_check
    button: |
      **Was the TODI filed with the Recorder of Deeds Office in ${end_in_county(notice_property.county)}?**

      ${ word(yesno(todi_filed_check))}
  - Edit: todi_date
    button: |
      **When was the TODI executed?**

      ${todi_date }
  - Edit: document_number
    button: |
      **Recorder of Deeds document number:**

      ${document_number}
  - Edit: notice_property.pin
    button: |
      **Property Index Number:**

      PIN: ${ notice_property.pin }
  - Edit: notice_property.description
    button: |
      **The property's legal description:**

      ${ notice_property.description }
---
id: owners review screen
section: Owners
event: section_owners
question: |
  Owners
subquestion: |
  Edit your answers below.
review:
  - Edit: owner.name.first
    button: |
      **Name of the property owner who died:**

      ${owner.name_full()}
  - Edit: owner.death_date
    button: |
      **Date of ${owner.name_full()}'s death:**

      ${owner.death_date }
  - Edit: owner.outside_us
    button: |
      **Where was ${owner.name_full()} living when they died?**

      % if owner.outside_us:
      ${owner.country}
      % else:
      ${end_in_county(owner.address.county)}, ${owner.address.state}
      % endif
  - Edit: owner.marital_status
    button: |
      **${owner.name_full()}'s marital status when they died:**

      ${ owner.marital_status }
  - Edit: other_owners_check
    button: |
      **Did ${owner.name_full()} own this property by themself?**

      % if other_owners_check == "sole":
      Yes
      % else:
      No, they shared ownership of this property.
      % endif
  - Edit: shared_owners_type
    button: |
      **Type of shared ownership:**

      ${ shared_owners_type }
    show if: other_owners_check != "sole"
  - Edit: decedent_common_share
    button: |
      **${owner.name_full()}'s share of the property:**

      ${decedent_common_share }%
    show if: other_owners_check != "sole" and shared_owners_type == "Tenancy in common"
  - Edit: all_owners_dead_check
    button: |
      **Are all the property's owners dead?**

      ${ word(yesno(all_owners_dead_check))} 
    show if: other_owners_check != "sole" and shared_owners_type != "Tenancy in common"
  - Edit: other_owners.revisit
    button: |-
      **Other owners: (Edit to change name, location, and other info)**

      % for item in other_owners:
      - ${ item }
      % endfor
    show if: other_owners_check != "sole" and shared_owners_type != "Tenancy in common"
---
id: beneficiaries review screen
section: Beneficiaries
event: section_beneficiaries
question: |
  Beneficiaries
subquestion: |
  Edit your answers below.
review:
  - Edit: users[0].name.first
    button: |-
      **Your name:**
      
      ${users[0].name_full()}
  - Edit: users[0].related_who
    button: |
      **You are related to:**
      
      ${users[0].related_who}
    show if: other_owners_check != "sole" and shared_owners_type != "Tenancy in common"
  - Edit: users[0].relationship_radio
    button: |
      % if other_owners_check == "multiple" and shared_owners_type != "Tenancy in common":
      **Your relationship to ${users[0].related_who}:**
      % else:
      **Your relationship to ${owner.name_full()}:**
      % endif
      
      % if users[0].relationship_radio == "Other":
      ${users[0].relationship}
      % else:
      ${users[0].relationship_radio}
      % endif
  - Edit: users[0].address.address
    button: |
      **Your address:**
      
      ${users[0].address.line_one(bare=True)}       
      ${users[0].address.line_two()}     
      ${end_in_county(users[0].address.county)}
  - Edit: other_beneficiaries_check
    button: |
      **Are there other beneficiaries named in the TODI?**

      ${ word(yesno(other_beneficiaries_check))}
  - Edit: tenancy_type
    button: |
      **How do the beneficiaries own the property?**

      As ${tenancy_type.lower()}
    show if: other_beneficiaries_check
  - Edit: even_split
    button: |
     **Are the beneficiaries splitting the property evenly?**

     % if even_split:
     Yes, they each get 1/${users.number_gathered()} of the property.
     % else:
     No, they each get a different percentage of the property. 
     
     **Note:** Edit the beneficiaries' information below to change the percentages.
     % endif
    show if: users.number_gathered() > 1 and tenancy_type == "Tenants in common"
  - Edit: users[0].percent_share
    button: |
      **Your percent share of the property:**

      ${truncate_hundredth(users[0].percent_share)}%
    show if: users.number_gathered() > 1 and tenancy_type == "Tenants in common" and not even_split
  - Edit: users.revisit
    button: |
      % if tenancy_type == "Tenants in common":
      **Beneficiaries: (Edit to change name, percent share, and other info)**
      % else:
      **Beneficiaries: (Edit to change name, address, and other info)**
      % endif

      % for item in users:
      - ${ item }
      % endfor
    show if: other_beneficiaries_check
  - Edit: tax_payer_who
    button: |
      **Who should tax bills for the property be mailed to?**
      
       ${tax_payer_who}
    show if: users.number_gathered() > 1